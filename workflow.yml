## 🔍 Key Insights (EDA)

- Salary increases strongly with experience  
- Big tech companies (Amazon, Google, Microsoft) offer higher salary ranges  
- Performance rating positively impacts salary  
- Salary distribution is right-skewed (real-world pattern)

---

## 🌳 Feature Importance (Explainable AI)

Top factors influencing salary:

- Experience (dominant factor ~87%)
- Company type (Big Tech premium)
- Performance rating
- Location and role (minor impact)

